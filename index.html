<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOP THE STOP ～とりあえず止めとけ～</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      body {
        margin: 0;
        background-color: #121212;
        color: #ffffff;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        max-width: 400px;
        height: 100vh;
        max-height: 700px;
        background-color: #1e1e24;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }
      .header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        color: #aaa;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      /* ミュートボタンのデザイン */
      #mute-btn {
        background: #2b2b36;
        border: 1px solid #444;
        color: #fff;
        font-size: 18px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
      }
      #mute-btn:active {
        transform: scale(0.9);
      }
      .score-display {
        font-size: 64px;
        font-weight: 900;
        margin: 10px 0;
      }
      canvas {
        background-color: #2b2b36;
        border-radius: 12px;
        width: 100%;
        height: 360px;
        cursor: pointer;
      }
      .instruction {
        font-size: 16px;
        color: #888;
        margin-bottom: 10px;
      }

      /* タイトル画面 */
      #title-screen {
        position: absolute;
        inset: 0;
        background: rgba(18, 18, 24, 0.96);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        z-index: 20;
        cursor: pointer;
      }
      .title-main {
        font-size: min(7vw, 30px);   /* 画面幅に合わせて縮み、最大30px */
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.1;
        margin: 0;
        white-space: nowrap;         /* 折り返しを禁止 */
      }
      .title-sub {
        font-size: 16px;
        color: #00e676;
        margin: 14px 0 0;
        letter-spacing: 1px;
      }
      .title-best {
        font-size: 14px;
        color: #888;
        margin: 36px 0 0;
      }
      .tap-start {
        font-size: 20px;
        font-weight: bold;
        color: #ffffff;
        margin-top: 40px;
        animation: blink 1.2s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      #result-screen {
        position: absolute;
        inset: 0;
        background: rgba(18, 18, 24, 0.92);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        z-index: 10;
      }
      .btn {
        width: 80%;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-retry {
        background-color: #00e676;
        color: #121212;
      }
      .btn-share {
        background-color: #000000;
        border: 1px solid #555;
        color: #ffffff;
        text-decoration: none;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div class="header">
        <div>LEVEL <span id="level-text">1</span></div>
        <div class="header-right">
          <div>BEST: <span id="best-text">0</span></div>
          <button id="mute-btn" title="ミュート切替">🔊</button>
        </div>
      </div>
      
      <div class="score-display" id="score-text">0</div>
      
      <canvas id="gameCanvas" width="360" height="360"></canvas>
      
      <div class="instruction">画面タップ / クリックでストップ！</div>

      <!-- タイトル画面 -->
      <div id="title-screen">
        <h1 class="title-main">STOP THE STOP</h1>
        <p class="title-sub">～とりあえず止めとけ～</p>
        <p class="title-best">BEST: <span id="title-best-text">0</span></p>
        <div class="tap-start">TAP TO START</div>
      </div>

      <div id="result-screen">
        <h2 style="color: #ff5252; font-size: 32px; margin: 0;">GAME OVER</h2>
        <p style="font-size: 20px; margin: 15px 0;">SCORE: <strong id="final-score" style="font-size: 36px;">0</strong></p>
        <p id="new-record-msg" style="color: #ffd740; font-weight: bold; display: none;">🎉 NEW RECORD! 🎉</p>
        
        <button class="btn btn-retry" id="retry-btn">もう1回プレイ</button>
        <a class="btn btn-share" id="share-btn" href="#" target="_blank" rel="noopener noreferrer">𝕏 で結果をシェア</a>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      
      const scoreText = document.getElementById('score-text');
      const levelText = document.getElementById('level-text');
      const bestText = document.getElementById('best-text');
      const titleBestText = document.getElementById('title-best-text');
      const titleScreen = document.getElementById('title-screen');
      const muteBtn = document.getElementById('mute-btn');
      const resultScreen = document.getElementById('result-screen');
      const finalScoreText = document.getElementById('final-score');
      const newRecordMsg = document.getElementById('new-record-msg');
      const retryBtn = document.getElementById('retry-btn');
      const shareBtn = document.getElementById('share-btn');

      let bestScore = localStorage.getItem('justStopBest') || 0;
      bestText.textContent = bestScore;
      titleBestText.textContent = bestScore;

      // ミュート状態の管理（設定もブラウザに保存）
      let isMuted = localStorage.getItem('justStopMuted') === 'true';
      muteBtn.textContent = isMuted ? '🔇' : '🔊';

      muteBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); // ゲームのタップ判定と重ならないようにする
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? '🔇' : '🔊';
        localStorage.setItem('justStopMuted', isMuted);
      });

      // Web Audio API（音量を控えめに調整）
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playSound(type, level) {
        if (isMuted) return; // ミュート中は鳴らさない
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'success') {
          osc.type = 'sine';
          const freq = Math.min(1200, 440 + (level - 1) * 35);
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
          // 音量を控えめ（0.07）に設定
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.3);
          // ブザー音は耳に響きやすいのでさらに控えめ（0.04）に設定
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      }

      let score = 0;
      let level = 1;
      let isStarted = false;   // タイトル画面から開始済みか
      let isGameOver = false;
      let animationId;

      const trackY = 180;
      const trackMargin = 30;
      const trackWidth = canvas.width - trackMargin * 2;
      const centerX = canvas.width / 2;
      
      let barX = trackMargin;
      let barWidth = 10;
      let barSpeed = 3.5;
      let barDirection = 1;

      let targetX = 120;
      let targetWidth = 120;

      function setupNextLevel() {
        targetWidth = Math.max(14, 120 - (level - 1) * 6);
        targetX = centerX - (targetWidth / 2);
        barSpeed = Math.min(13, 3.5 + (level - 1) * 0.4);
      }

      // 画面の描画のみ（動きの更新は行わない）
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. レール
        ctx.fillStyle = '#444455';
        ctx.fillRect(trackMargin, trackY - 10, trackWidth, 20);

        // 2. ターゲットエリア
        ctx.fillStyle = '#00e676';
        ctx.fillRect(targetX, trackY - 16, targetWidth, 32);

        // 中央の基準線
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(centerX - 1, trackY - 20, 2, 40);

        // 3. バー
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(barX, trackY - 28, barWidth, 56);
      }

      function resetState() {
        score = 0;
        level = 1;
        isGameOver = false;
        barX = trackMargin;
        barDirection = 1;
        
        scoreText.textContent = score;
        levelText.textContent = level;
        resultScreen.style.display = 'none';
        newRecordMsg.style.display = 'none';
        
        setupNextLevel();
      }

      function initGame() {
        cancelAnimationFrame(animationId);
        resetState();
        loop();
      }

      function loop() {
        if (isGameOver) return;

        // バーの移動
        barX += barSpeed * barDirection;
        if (barX + barWidth >= trackMargin + trackWidth) {
          barX = trackMargin + trackWidth - barWidth;
          barDirection = -1;
        } else if (barX <= trackMargin) {
          barX = trackMargin;
          barDirection = 1;
        }

        draw();
        animationId = requestAnimationFrame(loop);
      }

      function handleTap(e) {
        if (!isStarted || isGameOver) return;
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;

        const barCenter = barX + barWidth / 2;
        
        if (barCenter >= targetX && barCenter <= targetX + targetWidth) {
          playSound('success', level);
          score += 100;
          level++;
          scoreText.textContent = score;
          levelText.textContent = level;
          
          if (navigator.vibrate) navigator.vibrate(30);
          
          setupNextLevel();
        } else {
          playSound('gameover', level);
          gameOver();
        }
      }

      function gameOver() {
        isGameOver = true;
        cancelAnimationFrame(animationId);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        finalScoreText.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('justStopBest', bestScore);
          bestText.textContent = bestScore;
          titleBestText.textContent = bestScore;
          newRecordMsg.style.display = 'block';
        }

        // Xシェア用URLの生成（Web公開時のみURLを自動付与）
        const clearedLevel = level - 1;
        const levelMsg = clearedLevel > 0
          ? `レベル${clearedLevel}までクリア！`
          : `レベル1で惜しくも失敗…`;
        const shareText = encodeURIComponent(`【STOP THE STOP】${levelMsg}スコアは ${score} 点でした！\n#STOP_THE_STOP #ゲーム制作`);
        const currentUrl = window.location.href;
        const urlParam = currentUrl.startsWith('http') ? `&url=${encodeURIComponent(currentUrl)}` : '';
        
        shareBtn.href = "https://x.com/intent/tweet?text=" + shareText + urlParam;

        resultScreen.style.display = 'flex';
      }

      // タイトル画面をタップしてゲーム開始
      titleScreen.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); // この最初のタップがストップ判定にならないようにする
        if (isStarted) return;
        isStarted = true;
        titleScreen.style.display = 'none';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        initGame();
      });

      document.getElementById('game-container').addEventListener('pointerdown', handleTap);
      retryBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        initGame();
      });

      // 起動時はタイトル画面の裏に静止状態のゲーム画面を描画しておく
      resetState();
      draw();
      // 開発者ツール関連のキー操作・右クリックを無効化（簡易的な抑止）
      document.addEventListener('keydown', (e) => {
        const ctrlOrCmd = e.ctrlKey || e.metaKey;
        const isBlocked =
          e.code === 'F12' ||                                            // F12
          (ctrlOrCmd && e.shiftKey && ['KeyI', 'KeyJ', 'KeyC'].includes(e.code)) || // Ctrl+Shift+I/J/C
          (e.metaKey && e.altKey && ['KeyI', 'KeyJ', 'KeyC'].includes(e.code)) ||   // Mac: Cmd+Option+I/J/C
          (ctrlOrCmd && e.code === 'KeyU');                              // ソース表示 (Ctrl+U / Cmd+Option+U)
        if (isBlocked) e.preventDefault();
      });
      document.addEventListener('contextmenu', (e) => e.preventDefault()); // 右クリック禁止
    </script>
  </body>
</html>
