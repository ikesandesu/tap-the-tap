<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAP THE TAP ～とりあえずタップしとけ～</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      html, body {
        margin: 0;
        height: 100%;
      }
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh; /* スマホのアドレスバーで見切れないように */
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        max-width: 400px;
        height: 100vh;
        height: 100dvh;
        max-height: 700px;
        background-color: #1e1e24;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }
      .header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        color: #aaa;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #mute-btn {
        background: #2b2b36;
        border: 1px solid #444;
        color: #fff;
        font-size: 18px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
      }
      #mute-btn:active {
        transform: scale(0.9);
      }
      .score-display {
        font-size: 64px;
        font-weight: 900;
        margin: 10px 0;
      }
      canvas {
        background-color: #2b2b36;
        border-radius: 12px;
        width: 100%;
        max-width: 360px;
        aspect-ratio: 1 / 1; /* 幅が狭くても歪まない */
        height: auto;
        cursor: pointer;
      }
      .instruction {
        font-size: 16px;
        color: #888;
        margin-bottom: 10px;
      }

      /* タイトル画面 */
      #title-screen {
        position: absolute;
        inset: 0;
        background: rgba(18, 18, 24, 0.96);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        z-index: 20;
        cursor: pointer;
      }
      .title-main {
        font-size: min(7vw, 30px);
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.1;
        margin: 0;
        white-space: nowrap;
      }
      .title-sub {
        font-size: 16px;
        color: #00e676;
        margin: 14px 0 0;
        letter-spacing: 1px;
      }
      .title-best {
        font-size: 14px;
        color: #888;
        margin: 36px 0 0;
      }
      .tap-start {
        font-size: 20px;
        font-weight: bold;
        color: #ffffff;
        margin-top: 40px;
        animation: blink 1.2s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @media (prefers-reduced-motion: reduce) {
        .tap-start { animation: none; }
      }

      #result-screen {
        position: absolute;
        inset: 0;
        background: rgba(18, 18, 24, 0.92);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        z-index: 10;
      }
      .btn {
        width: 80%;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-retry {
        background-color: #00e676;
        color: #121212;
      }
      .btn-share {
        background-color: #000000;
        border: 1px solid #555;
        color: #ffffff;
        text-decoration: none;
        display: inline-block;
      }
      .btn:focus-visible, #mute-btn:focus-visible {
        outline: 2px solid #ffd740;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div class="header">
        <div>LEVEL <span id="level-text">1</span></div>
        <div class="header-right">
          <div>BEST: <span id="best-text">0</span></div>
          <button id="mute-btn" title="ミュート切替" aria-label="ミュート切替">🔊</button>
        </div>
      </div>

      <div class="score-display" id="score-text">0</div>

      <canvas id="gameCanvas"></canvas>

      <div class="instruction">画面タップ / クリック / スペースキーでストップ！</div>

      <!-- タイトル画面 -->
      <div id="title-screen">
        <h1 class="title-main">TAP THE TAP</h1>
        <p class="title-sub">～とりあえずタップしとけ～</p>
        <p class="title-best">BEST: <span id="title-best-text">0</span></p>
        <div class="tap-start">TAP TO START</div>
      </div>

      <div id="result-screen">
        <h2 style="color: #ff5252; font-size: 32px; margin: 0;">GAME OVER</h2>
        <p style="font-size: 20px; margin: 15px 0;">SCORE: <strong id="final-score" style="font-size: 36px;">0</strong></p>
        <p id="new-record-msg" style="color: #ffd740; font-weight: bold; display: none;">🎉 NEW RECORD! 🎉</p>

        <button class="btn btn-retry" id="retry-btn">もう1回プレイ</button>
        <a class="btn btn-share" id="share-btn" href="#" target="_blank" rel="noopener noreferrer">𝕏 で結果をシェア</a>
      </div>
    </div>

    <script>
      // ===== 設定 =====
      const LOGICAL_SIZE = 360;       // 描画上の論理サイズ
      const READY_MS = 600;           // ゲーム開始前の「READY」表示時間
      const RANDOM_TARGET_LEVEL = 11; // このレベルからターゲット位置がランダムになる
      const EDGE_JUDGE = true;        // true: バーが少しでもかかれば成功 / false: バーの中心のみで判定
      const FLASH_MS = 250;           // 成功時にターゲットが光る時間

      // ===== localStorage を安全に扱う（使えない環境でも落ちない）=====
      function safeGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }
      function safeSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) { /* 保存できなくても続行 */ }
      }

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // Retina 等の高解像度画面でぼやけないようにする
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = LOGICAL_SIZE * dpr;
      canvas.height = LOGICAL_SIZE * dpr;
      ctx.scale(dpr, dpr);

      const scoreText = document.getElementById('score-text');
      const levelText = document.getElementById('level-text');
      const bestText = document.getElementById('best-text');
      const titleBestText = document.getElementById('title-best-text');
      const titleScreen = document.getElementById('title-screen');
      const muteBtn = document.getElementById('mute-btn');
      const resultScreen = document.getElementById('result-screen');
      const finalScoreText = document.getElementById('final-score');
      const newRecordMsg = document.getElementById('new-record-msg');
      const retryBtn = document.getElementById('retry-btn');
      const shareBtn = document.getElementById('share-btn');

      let bestScore = Number(safeGet('justStopBest')) || 0;
      bestText.textContent = bestScore;
      titleBestText.textContent = bestScore;

      let isMuted = safeGet('justStopMuted') === 'true';
      muteBtn.textContent = isMuted ? '🔇' : '🔊';

      muteBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? '🔇' : '🔊';
        safeSet('justStopMuted', isMuted);
      });

      // ===== Web Audio（最初に必要になった時に作る。作れない環境でもゲームは動く）=====
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playSound(type, level) {
        if (isMuted) return;
        const ac = getAudio();
        if (!ac) return;

        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);

        const now = ac.currentTime;
        if (type === 'success') {
          osc.type = 'sine';
          const freq = Math.min(1200, 440 + (level - 1) * 35);
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.3);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      }

      // ===== ゲーム状態 =====
      let score = 0;
      let level = 1;
      let isStarted = false;   // タイトル画面から開始済みか
      let isGameOver = false;
      let isReady = false;     // READY 表示中（入力を受け付けない）
      let animationId = null;
      let readyTimer = null;
      let lastTime = 0;
      let flashStart = -Infinity;

      const trackY = 180;
      const trackMargin = 30;
      const trackWidth = LOGICAL_SIZE - trackMargin * 2;
      const centerX = LOGICAL_SIZE / 2;

      let barX = trackMargin;
      const barWidth = 10;
      let barSpeed = 3.5;      // 60fps 基準の 1 フレームあたりの移動量
      let barDirection = 1;

      let targetX = 120;
      let targetWidth = 120;
      let targetIsCentered = true;

      function setupNextLevel() {
        targetWidth = Math.max(14, 120 - (level - 1) * 1.5);
        barSpeed = Math.min(10, 3.5 + (level - 1) * 0.1);

        if (level >= RANDOM_TARGET_LEVEL) {
          targetIsCentered = false;
          targetX = trackMargin + Math.random() * (trackWidth - targetWidth);
        } else {
          targetIsCentered = true;
          targetX = centerX - (targetWidth / 2);
        }
      }

      function draw(now = performance.now()) {
        ctx.clearRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

        // 1. レール
        ctx.fillStyle = '#444455';
        ctx.fillRect(trackMargin, trackY - 10, trackWidth, 20);

        // 2. ターゲットエリア（成功直後は光る）
        const flash = Math.max(0, 1 - (now - flashStart) / FLASH_MS);
        if (flash > 0) {
          ctx.shadowColor = '#00e676';
          ctx.shadowBlur = 30 * flash;
          ctx.fillStyle = '#b9f6ca';
        } else {
          ctx.fillStyle = '#00e676';
        }
        ctx.fillRect(targetX, trackY - 16, targetWidth, 32);
        ctx.shadowBlur = 0;

        // 中央の基準線（ターゲットが中央にある間だけ表示）
        if (targetIsCentered) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.fillRect(centerX - 1, trackY - 20, 2, 40);
        }

        // 3. バー
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(barX, trackY - 28, barWidth, 56);

        // 4. READY 表示
        if (isReady) {
          ctx.fillStyle = 'rgba(30, 30, 36, 0.55)';
          ctx.fillRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 44px "Helvetica Neue", Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('READY', centerX, trackY - 90);
        }
      }

      function resetState() {
        score = 0;
        level = 1;
        isGameOver = false;
        barX = trackMargin;
        barDirection = 1;
        flashStart = -Infinity;

        scoreText.textContent = score;
        levelText.textContent = level;
        resultScreen.style.display = 'none';
        newRecordMsg.style.display = 'none';

        setupNextLevel();
      }

      function initGame() {
        cancelAnimationFrame(animationId);
        clearTimeout(readyTimer);
        resetState();

        // 少し待ってから動き出す（リトライ直後のミスタップ防止）
        isReady = true;
        draw();
        readyTimer = setTimeout(() => {
          isReady = false;
          lastTime = 0;
          animationId = requestAnimationFrame(loop);
        }, READY_MS);
      }

      function loop(t) {
        if (isGameOver) return;

        // 経過時間から移動量を計算（リフレッシュレートに依存しない）
        const dt = lastTime ? Math.min((t - lastTime) / 16.667, 3) : 1;
        lastTime = t;

        barX += barSpeed * barDirection * dt;
        if (barX + barWidth >= trackMargin + trackWidth) {
          barX = trackMargin + trackWidth - barWidth;
          barDirection = -1;
        } else if (barX <= trackMargin) {
          barX = trackMargin;
          barDirection = 1;
        }

        draw(t);
        animationId = requestAnimationFrame(loop);
      }

      function isHit() {
        if (EDGE_JUDGE) {
          return barX + barWidth >= targetX && barX <= targetX + targetWidth;
        }
        const barCenter = barX + barWidth / 2;
        return barCenter >= targetX && barCenter <= targetX + targetWidth;
      }

      function stopBar() {
        if (!isStarted || isGameOver || isReady) return;

        if (isHit()) {
          playSound('success', level);
          score += 100;
          level++;
          scoreText.textContent = score;
          levelText.textContent = level;
          flashStart = performance.now();

          if (navigator.vibrate) navigator.vibrate(30);

          setupNextLevel();
        } else {
          playSound('gameover', level);
          gameOver();
        }
      }

      function handleTap(e) {
        if (e.target.closest('button, a')) return;
        stopBar();
      }

      function gameOver() {
        isGameOver = true;
        cancelAnimationFrame(animationId);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        finalScoreText.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          safeSet('justStopBest', bestScore);
          bestText.textContent = bestScore;
          titleBestText.textContent = bestScore;
          newRecordMsg.style.display = 'block';
        }

        // Xシェア用URLの生成
        const clearedLevel = level - 1;
        const levelMsg = clearedLevel > 0
          ? `レベル${clearedLevel}までクリア！`
          : `レベル1で惜しくも失敗…`;
        const shareText = encodeURIComponent(`【TAP THE TAP】${levelMsg}スコアは ${score} 点でした！\n#TAP_THE_TAP #ゲーム制作\nhttps://x.com/freestylenote/status/2123795649204564368`);

        shareBtn.href = "https://x.com/intent/tweet?text=" + shareText;

        resultScreen.style.display = 'flex';
      }

      function startGame() {
        if (isStarted) return;
        isStarted = true;
        titleScreen.style.display = 'none';
        getAudio();
        initGame();
      }

      // タイトル画面をタップしてゲーム開始
      titleScreen.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); // この最初のタップがストップ判定にならないようにする
        startGame();
      });

      document.getElementById('game-container').addEventListener('pointerdown', handleTap);
      retryBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        initGame();
      });

      // スペースキー: タイトル→開始 / プレイ中→ストップ / ゲームオーバー→リトライ
      document.addEventListener('keydown', (e) => {
        if (e.code !== 'Space' || e.repeat) return;
        e.preventDefault();
        if (!isStarted) {
          startGame();
        } else if (isGameOver) {
          initGame();
        } else {
          stopBar();
        }
      });

      // 起動時はタイトル画面の裏に静止状態のゲーム画面を描画しておく
      resetState();
      draw();
    </script>
    <script data-goatcounter="https://ikesandesu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
